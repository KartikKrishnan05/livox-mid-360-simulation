# ros_gz_bridge configuration for the Livox Mid-360 simulation.
# /livox/points and /livox/imu_raw are internal: livox_driver_emulator turns them into
# /livox/lidar (CustomMsg / PointCloud2) and /livox/imu (in g), like livox_ros_driver2.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /livox/points
  gz_topic_name: /livox/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /livox/imu_raw
  gz_topic_name: /livox/imu_raw
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
